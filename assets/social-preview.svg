<svg width="1280" height="640" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="logo-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B5BE6" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7B5BE6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg-glow" cx="30%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#1A1040" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0E1116" stop-opacity="1"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bg-glow)"/>

  <!-- Subtle dot grid -->
  <pattern id="dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#252C38" opacity="0.6"/>
  </pattern>
  <rect width="1280" height="640" fill="url(#dots)"/>

  <!-- Glow halo behind logo -->
  <ellipse cx="240" cy="320" rx="220" ry="220" fill="url(#logo-glow)"/>

  <!-- Logo (200×200) centered at (240, 320) -->
  <g transform="translate(140, 220)">
    <circle cx="100" cy="100" r="78" fill="#161B22"/>
    <path d="M 100 100 L 100 28 L 138 60 Z" fill="#1F2630"/>
    <path d="M 100 100 L 100 28 L 138 60 Z" fill="#252C38" transform="rotate(60 100 100)"/>
    <path d="M 100 100 L 100 28 L 138 60 Z" fill="#1F2630" transform="rotate(120 100 100)"/>
    <path d="M 100 100 L 100 28 L 138 60 Z" fill="#252C38" transform="rotate(180 100 100)"/>
    <path d="M 100 100 L 100 28 L 138 60 Z" fill="#1F2630" transform="rotate(240 100 100)"/>
    <path d="M 100 100 L 100 28 L 138 60 Z" fill="#252C38" transform="rotate(300 100 100)"/>
    <circle cx="100" cy="100" r="22" fill="#2EB872"/>
    <path d="M 90 100 L 98 108 L 112 92" fill="none" stroke="#F7F4EC" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="100" cy="100" r="78" fill="none" stroke="#7B5BE6" stroke-width="2"/>
  </g>

  <!-- Vertical divider -->
  <line x1="390" y1="180" x2="390" y2="460" stroke="#252C38" stroke-width="1" opacity="0.8"/>

  <!-- Title -->
  <text
    x="440" y="308"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="100"
    font-weight="700"
    fill="#F7F4EC"
    letter-spacing="-3"
  >revelio</text>

  <!-- Purple accent bar -->
  <rect x="440" y="322" width="520" height="3" rx="1.5" fill="#7B5BE6"/>

  <!-- Tagline -->
  <text
    x="440" y="378"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="27"
    fill="#999999"
  >Host-level dependency audit for macOS and Linux</text>

  <!-- Feature tags -->
  <text
    x="440" y="432"
    font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif"
    font-size="20"
    fill="#7B5BE6"
    opacity="0.85"
  >Bash  ·  No cloud  ·  No account  ·  One scan</text>
</svg>
